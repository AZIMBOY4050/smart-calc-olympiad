<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc Pro | Вау-Эффект</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #f093fb;
            --accent2: #f5576c;
            --bg-dark: #0a0a12;
            --panel-bg: rgba(20, 20, 35, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(240, 147, 251, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 20px;
        }
        .lang-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
            border-color: var(--primary);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 30px;
            position: relative;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 0;
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        .equation-preview {
            text-align: center; font-size: 20px; font-weight: 300; letter-spacing: 2px;
            margin-bottom: 25px; color: var(--primary); text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .input-group { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
        .input-wrapper { position: relative; flex: 1; }
        .input-wrapper label {
            position: absolute; top: -10px; left: 15px; background: var(--bg-dark);
            padding: 0 5px; font-size: 12px; color: var(--secondary); border-radius: 5px; font-weight: 600; z-index: 1;
        }
        input, select {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 15px; color: #fff; font-size: 18px; text-align: center;
            outline: none; transition: all 0.3s ease; appearance: none;
        }
        select { text-align: left; cursor: pointer; font-size: 14px;}
        select option { background: var(--bg-dark); }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); background: rgba(0, 0, 0, 0.4); }

        .solve-btn {
            width: 100%; padding: 16px; border: none; border-radius: 15px;
            background: linear-gradient(135deg, var(--secondary), var(--primary)); color: white;
            font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3); position: relative; overflow: hidden;
        }
        .solve-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transition: 0.5s;
        }
        .solve-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(79, 172, 254, 0.4); }
        .solve-btn:hover::before { left: 100%; }
        .solve-btn:active { transform: translateY(1px); }

        .result-container {
            margin-top: 30px; padding: 20px; background: rgba(0, 0, 0, 0.2);
            border-radius: 20px; border-top: 2px solid var(--accent); display: none;
        }
        .step-item {
            margin-bottom: 12px; font-size: 16px; line-height: 1.5; color: #e2e8f0;
            opacity: 0; transform: translateY(10px); animation: slideUpFade 0.4s forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        .geom-selector { margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="lang-switcher">
        <button class="lang-btn active" id="btn_ru" onclick="changeLang('ru')">RU</button>
        <button class="lang-btn" id="btn_uz" onclick="changeLang('uz')">UZ</button>
        <button class="lang-btn" id="btn_en" onclick="changeLang('en')">EN</button>
    </div>

    <div class="header">
        <h1>SmartCalc Pro</h1>
        <p id="t_subtitle">Математика — это красиво</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="t_tab_quad" onclick="switchTab('quadratic')">Квадратные</button>
        <button class="tab-btn" id="t_tab_lin" onclick="switchTab('linear')">Линейные</button>
        <button class="tab-btn" id="t_tab_geo" onclick="switchTab('geometry')">Геометрия</button>
    </div>

    <div id="quadratic" class="tab-content active">
        <div class="equation-preview">ax² + bx + c = 0</div>
        <div class="input-group">
            <div class="input-wrapper"><label>a</label><input type="number" id="q_a" value="1"></div>
            <div class="input-wrapper"><label>b</label><input type="number" id="q_b" value="-5"></div>
            <div class="input-wrapper"><label>c</label><input type="number" id="q_c" value="6"></div>
        </div>
        <button class="solve-btn t_btn_solve" onclick="solve('quadratic')">Вычислить</button>
    </div>

    <div id="linear" class="tab-content">
        <div class="equation-preview">ax + b = 0</div>
        <div class="input-group">
            <div class="input-wrapper"><label>a</label><input type="number" id="l_a" value="2"></div>
            <div class="input-wrapper"><label>b</label><input type="number" id="l_b" value="-8"></div>
        </div>
        <button class="solve-btn t_btn_solve" onclick="solve('linear')">Вычислить</button>
    </div>

    <div id="geometry" class="tab-content">
        <div class="equation-preview">S & P</div>
        
        <div class="input-wrapper geom-selector">
            <label id="t_lbl_shape">Фигура</label>
            <select id="geo_shape">
                <option value="rectangle" id="t_opt_rect">Прямоугольник (a, b)</option>
                <option value="triangle" id="t_opt_tri">Прямоугольный треугольник (катеты a, b)</option>
            </select>
        </div>

        <div class="input-group">
            <div class="input-wrapper"><label>a =</label><input type="number" id="g_a" value="4"></div>
            <div class="input-wrapper"><label>b =</label><input type="number" id="g_b" value="5"></div>
        </div>
        <button class="solve-btn t_btn_solve" onclick="solve('geometry')">Вычислить</button>
    </div>

    <div id="resultBox" class="result-container"></div>
</div>

<script>
    const i18n = {
        'ru': {
            subtitle: 'Математика — это красиво',
            tab_quad: 'Квадратные',
            tab_lin: 'Линейные',
            tab_geo: 'Геометрия',
            btn_solve: 'Вычислить',
            lbl_shape: 'Фигура',
            opt_rect: 'Прямоугольник (a, b)',
            opt_tri: 'Прямоугольный треугольник (катеты a, b)',
            loading: 'Анализируем данные... ⚡',
            error: 'Ошибка подключения! Сервер не запущен.'
        },
        'uz': {
            subtitle: 'Matematika — bu go\'zal',
            tab_quad: 'Kvadrat',
            tab_lin: 'Chiziqli',
            tab_geo: 'Geometriya',
            btn_solve: 'Hisoblash',
            lbl_shape: 'Shakl',
            opt_rect: 'To\'rtburchak (a, b)',
            opt_tri: 'To\'g\'ri burchakli uchburchak (katetlar a, b)',
            loading: 'Ma\'lumotlar tahlil qilinmoqda... ⚡',
            error: 'Ulanish xatosi! Server ishga tushirilmagan.'
        },
        'en': {
            subtitle: 'Math is beautiful',
            tab_quad: 'Quadratic',
            tab_lin: 'Linear',
            tab_geo: 'Geometry',
            btn_solve: 'Calculate',
            lbl_shape: 'Shape',
            opt_rect: 'Rectangle (a, b)',
            opt_tri: 'Right triangle (legs a, b)',
            loading: 'Analyzing data... ⚡',
            error: 'Connection Error! Server is not running.'
        }
    };

    let currentLang = 'ru';

    function changeLang(lang) {
        currentLang = lang;
        
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn_${lang}`).classList.add('active');

        document.getElementById('t_subtitle').innerText = i18n[lang].subtitle;
        document.getElementById('t_tab_quad').innerText = i18n[lang].tab_quad;
        document.getElementById('t_tab_lin').innerText = i18n[lang].tab_lin;
        document.getElementById('t_tab_geo').innerText = i18n[lang].tab_geo;
        document.getElementById('t_lbl_shape').innerText = i18n[lang].lbl_shape;
        document.getElementById('t_opt_rect').innerText = i18n[lang].opt_rect;
        document.getElementById('t_opt_tri').innerText = i18n[lang].opt_tri;
        
        document.querySelectorAll('.t_btn_solve').forEach(btn => {
            btn.innerText = i18n[lang].btn_solve;
        });

        document.getElementById('resultBox').style.display = 'none';
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    async function solve(type) {
        const resultBox = document.getElementById('resultBox');
        resultBox.innerHTML = ''; 
        resultBox.style.display = 'block';
        
        resultBox.innerHTML = `<div class="step-item" style="color: var(--primary);">${i18n[currentLang].loading}</div>`;

        let url = '';
        let payload = {};

        if (type === 'quadratic') {
            url = '/solve_quadratic';
            payload = {
                a: parseFloat(document.getElementById('q_a').value) || 0,
                b: parseFloat(document.getElementById('q_b').value) || 0,
                c: parseFloat(document.getElementById('q_c').value) || 0,
                lang: currentLang
            };
        } else if (type === 'linear') {
            url = '/solve_linear';
            payload = {
                a: parseFloat(document.getElementById('l_a').value) || 0,
                b: parseFloat(document.getElementById('l_b').value) || 0,
                lang: currentLang
            };
        } else if (type === 'geometry') {
            url = '/solve_geometry';
            payload = {
                shape: document.getElementById('geo_shape').value,
                a: parseFloat(document.getElementById('g_a').value) || 0,
                b: parseFloat(document.getElementById('g_b').value) || 0,
                lang: currentLang
            };
        }

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error('Network error');
            const data = await response.json();
            
            resultBox.innerHTML = '';
            data.steps.forEach((step, index) => {
                const stepEl = document.createElement('div');
                stepEl.className = 'step-item';
                
                if (step.includes("Ответ:") || step.includes("Javob:") || step.includes("Answer:")) {
                    stepEl.innerHTML = `<strong>${step}</strong>`;
                    stepEl.style.color = 'var(--primary)';
                    stepEl.style.fontSize = '18px';
                    stepEl.style.marginTop = '15px';
                } else {
                    stepEl.textContent = step;
                }
                
                stepEl.style.animationDelay = `${index * 0.15}s`;
                resultBox.appendChild(stepEl);
            });

        } catch (error) {
            resultBox.innerHTML = `
                <div class="step-item" style="color: var(--accent2); border-left: 4px solid var(--accent2); padding-left: 10px;">
                    <strong>${i18n[currentLang].error}</strong>
                </div>`;
        }
    }
</script>

</body>
</html>
