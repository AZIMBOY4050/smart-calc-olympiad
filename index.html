<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCalc Pro | Вау-Эффект</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #00f2fe; --secondary: #4facfe; --accent: #f093fb; --accent2: #f5576c;
            --bg-dark: #0a0a12; --panel-bg: rgba(20, 20, 35, 0.7);
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 15% 50%, rgba(79, 172, 254, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(240, 147, 251, 0.15), transparent 25%);
            color: var(--text-main); min-height: 100vh; display: flex;
            justify-content: center; align-items: center; padding: 20px;
        }
        .app-container {
            width: 100%; max-width: 500px; background: var(--panel-bg);
            backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px; padding: 35px 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4); z-index: 10;
        }
        .lang-switcher { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 15px; }
        .lang-btn {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted);
            padding: 5px 12px; border-radius: 10px; font-size: 12px; cursor: pointer; transition: 0.3s;
        }
        .lang-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 10px rgba(0,242,254,0.4); }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 28px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tabs { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 25px; 
            overflow-x: auto; 
            scroll-behavior: smooth;
            -ms-overflow-style: none; 
            scrollbar-width: none; 
            padding: 5px 0;
        }
        .tabs::-webkit-scrollbar { 
            display: none; 
        }

        .tab-btn { 
            flex: 0 0 auto; 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            color: var(--text-muted); 
            padding: 12px 24px; 
            font-size: 14px; 
            font-weight: 600; 
            border-radius: 15px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            white-space: nowrap; 
        }

        .tab-btn.active { 
            color: #000; 
            background: linear-gradient(135deg, var(--primary), var(--accent)); 
            box-shadow: 0 8px 20px rgba(240, 147, 251, 0.4); 
            border: none;
            transform: translateY(-2px);
        }
        
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        .equation-preview { text-align: center; font-size: 18px; letter-spacing: 1px; margin-bottom: 20px; color: var(--primary); }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        .input-wrapper { position: relative; flex: 1; min-width: 60px; }
        .input-wrapper label { position: absolute; top: -10px; left: 10px; background: var(--bg-dark); padding: 0 5px; font-size: 11px; color: var(--secondary); border-radius: 5px; }
        input, select { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: #fff; text-align: center; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0,242,254,0.2); }
        
        .solve-btn { width: 100%; padding: 15px; border: none; border-radius: 15px; background: linear-gradient(135deg, var(--secondary), var(--primary)); color: white; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .solve-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(79,172,254,0.4); }
        
        .result-container { margin-top: 25px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 20px; border-top: 2px solid var(--accent); display: none; }
        .step-item { margin-bottom: 10px; color: #e2e8f0; animation: slideUpFade 0.4s forwards; }
        
        
        #chartCanvas { margin-top: 20px; max-height: 250px; display: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-container">
    <div class="lang-switcher">
        <button class="lang-btn active" id="btn_ru" onclick="changeLang('ru')">RU</button>
        <button class="lang-btn" id="btn_uz" onclick="changeLang('uz')">UZ</button>
        <button class="lang-btn" id="btn_en" onclick="changeLang('en')">EN</button>
    </div>

    <div class="header">
        <h1>SmartCalc Pro</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="t_tab_quad" onclick="switchTab('quadratic')">Квадратные</button>
        <button class="tab-btn" id="t_tab_lin" onclick="switchTab('linear')">Линейные</button>
        <button class="tab-btn" id="t_tab_geo" onclick="switchTab('geometry')">Геометрия</button>
        <button class="tab-btn" id="t_tab_sys" onclick="switchTab('system')">Системы</button>
        <button class="tab-btn" id="t_tab_prog" onclick="switchTab('progression')">Прогрессии</button>
    </div>

    <!-- 1. Квадратные -->
    <div id="quadratic" class="tab-content active">
        <div class="equation-preview">ax² + bx + c = 0</div>
        <div class="input-group">
            <div class="input-wrapper"><label>a</label><input type="number" id="q_a" value="1"></div>
            <div class="input-wrapper"><label>b</label><input type="number" id="q_b" value="-5"></div>
            <div class="input-wrapper"><label>c</label><input type="number" id="q_c" value="6"></div>
        </div>
        <button class="solve-btn t_btn_solve" onclick="solve('quadratic')">Вычислить</button>
    </div>

    <!-- 2. Линейные -->
    <div id="linear" class="tab-content">
        <div class="equation-preview">ax + b = 0</div>
        <div class="input-group">
            <div class="input-wrapper"><label>a</label><input type="number" id="l_a" value="2"></div>
            <div class="input-wrapper"><label>b</label><input type="number" id="l_b" value="-8"></div>
        </div>
        <button class="solve-btn t_btn_solve" onclick="solve('linear')">Вычислить</button>
    </div>

    <!-- 3. Геометрия -->
    <div id="geometry" class="tab-content">
        <div class="equation-preview">S & P</div>
        <div class="input-wrapper" style="margin-bottom: 15px;">
            <label id="t_lbl_shape">Фигура</label>
            <select id="geo_shape">
                <option value="rectangle" id="t_opt_rect">Прямоугольник (a, b)</option>
                <option value="triangle" id="t_opt_tri">Прямоугольный треугольник (катеты a, b)</option>
            </select>
        </div>
        <div class="input-group">
            <div class="input-wrapper"><label>a</label><input type="number" id="g_a" value="4"></div>
            <div class="input-wrapper"><label>b</label><input type="number" id="g_b" value="5"></div>
        </div>
        <button class="solve-btn t_btn_solve" onclick="solve('geometry')">Вычислить</button>
    </div>

    <!-- 4. Системы уравнений -->
    <div id="system" class="tab-content">
        <div class="equation-preview">a₁x + b₁y = c₁<br>a₂x + b₂y = c₂</div>
        <div class="input-group">
            <div class="input-wrapper"><label>a₁</label><input type="number" id="s_a1" value="2"></div>
            <div class="input-wrapper"><label>b₁</label><input type="number" id="s_b1" value="3"></div>
            <div class="input-wrapper"><label>c₁</label><input type="number" id="s_c1" value="13"></div>
        </div>
        <div class="input-group">
            <div class="input-wrapper"><label>a₂</label><input type="number" id="s_a2" value="4"></div>
            <div class="input-wrapper"><label>b₂</label><input type="number" id="s_b2" value="-1"></div>
            <div class="input-wrapper"><label>c₂</label><input type="number" id="s_c2" value="5"></div>
        </div>
        <button class="solve-btn t_btn_solve" onclick="solve('system')">Вычислить</button>
    </div>

    <!-- 5. Прогрессии -->
    <div id="progression" class="tab-content">
        <div class="equation-preview" id="t_prog_title">Арифм. прогрессия</div>
        <div class="input-group">
            <div class="input-wrapper"><label>a₁</label><input type="number" id="p_a1" value="2"></div>
            <div class="input-wrapper"><label>d</label><input type="number" id="p_d" value="3"></div>
            <div class="input-wrapper"><label>n</label><input type="number" id="p_n" value="10"></div>
        </div>
        <button class="solve-btn t_btn_solve" onclick="solve('progression')">Вычислить</button>
    </div>

    <div id="resultBox" class="result-container">
        <div id="textResult"></div>
        
        <canvas id="chartCanvas"></canvas>
    </div>
</div>

<script>
    let mathChart = null; 

    const i18n = {
        'ru': {
            tab_quad: 'Квадратные', tab_lin: 'Линейные', tab_geo: 'Геометрия', tab_sys: 'Системы', tab_prog: 'Прогрессии',
            btn_solve: 'Вычислить', lbl_shape: 'Фигура', opt_rect: 'Прямоугольник (a, b)', opt_tri: 'Прямоугольный треугольник', prog_title: 'Арифм. прогрессия'
        },
        'uz': {
            tab_quad: 'Kvadrat', tab_lin: 'Chiziqli', tab_geo: 'Geometriya', tab_sys: 'Sistemalar', tab_prog: 'Progressiya',
            btn_solve: 'Hisoblash', lbl_shape: 'Shakl', opt_rect: 'To\'rtburchak (a, b)', opt_tri: 'Uchburchak', prog_title: 'Arifmetik progressiya'
        },
        'en': {
            tab_quad: 'Quadratic', tab_lin: 'Linear', tab_geo: 'Geometry', tab_sys: 'Systems', tab_prog: 'Progressions',
            btn_solve: 'Calculate', lbl_shape: 'Shape', opt_rect: 'Rectangle (a, b)', opt_tri: 'Right triangle', prog_title: 'Arithm. progression'
        }
    };
    let currentLang = 'ru';

    function changeLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn_${lang}`).classList.add('active');
        document.getElementById('t_tab_quad').innerText = i18n[lang].tab_quad;
        document.getElementById('t_tab_lin').innerText = i18n[lang].tab_lin;
        document.getElementById('t_tab_geo').innerText = i18n[lang].tab_geo;
        document.getElementById('t_tab_sys').innerText = i18n[lang].tab_sys;
        document.getElementById('t_tab_prog').innerText = i18n[lang].tab_prog;
        document.getElementById('t_lbl_shape').innerText = i18n[lang].lbl_shape;
        document.getElementById('t_opt_rect').innerText = i18n[lang].opt_rect;
        document.getElementById('t_opt_tri').innerText = i18n[lang].opt_tri;
        document.getElementById('t_prog_title').innerText = i18n[lang].prog_title;
        document.querySelectorAll('.t_btn_solve').forEach(b => b.innerText = i18n[lang].btn_solve);
        document.getElementById('resultBox').style.display = 'none';
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    
    function drawChart(type, params) {
        const ctx = document.getElementById('chartCanvas');
        ctx.style.display = 'block';
        if (mathChart) mathChart.destroy(); 

        let xValues = [], yValues = [];
        
        if (type === 'quadratic') {
            
            let vertexX = -params.b / (2 * params.a);
            if (isNaN(vertexX)) vertexX = 0;
            for (let x = vertexX - 5; x <= vertexX + 5; x += 0.5) {
                xValues.push(x.toFixed(1));
                yValues.push((params.a * Math.pow(x, 2) + params.b * x + params.c).toFixed(2));
            }
        } else if (type === 'linear') {
            for (let x = -10; x <= 10; x += 2) {
                xValues.push(x);
                yValues.push((params.a * x + params.b).toFixed(2));
            }
        }

        mathChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: xValues,
                datasets: [{
                    label: 'f(x)', data: yValues,
                    borderColor: '#00f2fe', borderWidth: 3, pointBackgroundColor: '#f093fb',
                    fill: false, tension: 0.4 
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8' } }
                }
            }
        });
    }

    async function solve(type) {
        const resultBox = document.getElementById('resultBox');
        const textResult = document.getElementById('textResult');
        const chartCanvas = document.getElementById('chartCanvas');
        
        resultBox.style.display = 'block';
        textResult.innerHTML = '<div style="color: var(--primary);">Считаем... ⚡</div>';
        chartCanvas.style.display = 'none'; 

        let url = `/${type === 'quadratic' ? 'solve_quadratic' : type === 'linear' ? 'solve_linear' : type === 'geometry' ? 'solve_geometry' : type === 'system' ? 'solve_system' : 'solve_progression'}`;
        let payload = { lang: currentLang };

        if (type === 'quadratic') {
            payload.a = parseFloat(document.getElementById('q_a').value) || 0;
            payload.b = parseFloat(document.getElementById('q_b').value) || 0;
            payload.c = parseFloat(document.getElementById('q_c').value) || 0;
        } else if (type === 'linear') {
            payload.a = parseFloat(document.getElementById('l_a').value) || 0;
            payload.b = parseFloat(document.getElementById('l_b').value) || 0;
        } else if (type === 'geometry') {
            payload.shape = document.getElementById('geo_shape').value;
            payload.a = parseFloat(document.getElementById('g_a').value) || 0;
            payload.b = parseFloat(document.getElementById('g_b').value) || 0;
        } else if (type === 'system') {
            payload.a1 = parseFloat(document.getElementById('s_a1').value) || 0;
            payload.b1 = parseFloat(document.getElementById('s_b1').value) || 0;
            payload.c1 = parseFloat(document.getElementById('s_c1').value) || 0;
            payload.a2 = parseFloat(document.getElementById('s_a2').value) || 0;
            payload.b2 = parseFloat(document.getElementById('s_b2').value) || 0;
            payload.c2 = parseFloat(document.getElementById('s_c2').value) || 0;
        } else if (type === 'progression') {
            payload.a1 = parseFloat(document.getElementById('p_a1').value) || 0;
            payload.d = parseFloat(document.getElementById('p_d').value) || 0;
            payload.n = parseInt(document.getElementById('p_n').value) || 1;
        }

        try {
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await response.json();
            
            textResult.innerHTML = '';
            data.steps.forEach(step => {
                const el = document.createElement('div'); el.className = 'step-item';
                if (step.includes("Ответ:") || step.includes("Javob:") || step.includes("Answer:")) {
                    el.innerHTML = `<strong>${step}</strong>`; el.style.color = 'var(--primary)'; el.style.fontSize = '18px';
                } else { el.textContent = step; }
                textResult.appendChild(el);
            });

            if (type === 'quadratic' || type === 'linear') {
                drawChart(type, payload);
            }

        } catch (e) {
            textResult.innerHTML = '<div style="color: var(--accent2);">Ошибка подключения!</div>';
        }
    }
</script>
</body>
</html>
